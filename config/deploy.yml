# Name of the application. Used to uniquely configure containers.
service: ip-tracker

# Name of the container image (Kamal prepends the registry server URL).
image: pgengler/ip-tracker

# Deploy to the same server, as user `apps`.
servers:
  web:
    - hyperion.pgengler.net

# SSH as the `apps` user (other apps on the server use this user with Kamal).
ssh:
  user: apps

# Credentials for the image host.
registry:
  server: ghcr.io
  username: pgengler
  password:
    - KAMAL_REGISTRY_PASSWORD

# kamal-proxy is shared across apps on this server and runs on port 8081.
# nginx handles SSL termination and proxies to kamal-proxy on port 8081.
proxy:
  host: ip.pgengler.net
  ssl: false
  forward_headers: true
  app_port: 3000
  healthcheck:
    path: /up
  run:
    http_port: 8081

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    RACK_ENV: production
    # PostgreSQL 16 runs in the `postgres16` Docker container, which is shared
    # with other apps on the server. Kamal puts app containers on the `kamal`
    # Docker network, so the container is reachable by name on port 5432.
    DB_HOST: postgres16
    DB_PORT: "5432"
    POSTGRES_DB: ip_tracker_production
    POSTGRES_USER: ip_tracker
  secret:
    - POSTGRES_PASSWORD

# Configure builder setup (target server is amd64).
builder:
  arch: amd64
